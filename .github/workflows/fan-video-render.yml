name: fan-video-render
on:
  push:
    branches:
      - chatgpt-fan-video-20260829
    paths:
      - fan_video/**
      - .github/workflows/fan-video-render.yml
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Ensure ffmpeg
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
          ffmpeg -version | head -1
      - name: Render real-photo visual track
        run: python3 fan_video/turbo_render.py
      - name: Upload visual track
        uses: actions/upload-artifact@v4
        with:
          name: fan-visual
          path: fan_video/output/fan_visual.mp4
          compression-level: 0
          retention-days: 1
