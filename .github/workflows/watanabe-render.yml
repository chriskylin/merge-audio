name: Watanabe asset bridge

on:
  push:
    branches:
      - watanabe-video-render-20260828

jobs:
  fetch-assets:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Fetch verified real-photo assets
        run: |
          chmod +x watanabe_render/fetch_assets.sh
          ./watanabe_render/fetch_assets.sh
      - name: Upload verified assets
        uses: actions/upload-artifact@v4
        with:
          name: watanabe-real-assets
          path: assets/
          if-no-files-found: error
          compression-level: 0
